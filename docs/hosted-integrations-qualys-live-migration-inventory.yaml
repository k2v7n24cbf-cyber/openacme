globalRules:
  - Status included_live means the tool is in the current promoted/source-backed hosted contract and must also appear in currentPromotedBatch.tools.
  - Broader planned migration rows stay blocked_evidence_required until exact endpoint, request, response, pagination, auth, and safety evidence exists.
  - currentPromotedBatch is the authoritative current hosted Qualys contract scope until a later batch promotion updates it.
  - Public hosted Qualys tools must be read-only live API-backed tools or reference-only quickref tools.
  - Cache-local qualys_cache_* tools are excluded from this live migration.
  - Mutating scan, report, purge, auth-record, and tag write operations are excluded.
  - ETM/TruRisk, TotalCloud/CloudView, CDR, Container Security, CertView, and Patch Management are excluded until explicitly rescoped.
  - Unknown provider endpoint, authentication, pagination, response, destructive, or parameter behavior must stop with EVIDENCE_REQUIRED before implementation.
  - Quickref tools may provide source discovery but never tenant evidence.
